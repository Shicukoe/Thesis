<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus ERP - Small Business Management</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Unified Top Navigation Header -->
        <header class="topbar">
            <!-- Brand Logo & Title -->
            <div class="brand">
                <div class="brand-logo">
                    <i data-lucide="layers" class="logo-icon"></i>
                </div>
                <div class="brand-info">
                    <h2>NexusERP</h2>
                    <span>Business Suite</span>
                </div>
            </div>
            
            <!-- Horizontal Navigation Menu -->
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-link" id="nav-dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#customers" class="nav-link" id="nav-customers">
                    <i data-lucide="users"></i>
                    <span>Customers</span>
                </a>
                <a href="#inventory" class="nav-link" id="nav-inventory">
                    <i data-lucide="package"></i>
                    <span>Products</span>
                </a>
                <a href="#sales" class="nav-link" id="nav-sales">
                    <i data-lucide="shopping-cart"></i>
                    <span>Sales Orders</span>
                </a>
                <a href="#purchases" class="nav-link" id="nav-purchases">
                    <i data-lucide="clipboard-list"></i>
                    <span>Purchase Orders</span>
                </a>
                <a href="#vendors" class="nav-link" id="nav-vendors">
                    <i data-lucide="truck"></i>
                    <span>Vendors</span>
                </a>
                <a href="#users" class="nav-link" id="nav-users">
                    <i data-lucide="shield-check"></i>
                    <span>User Accounts</span>
                </a>
                <a href="#reports" class="nav-link" id="nav-reports">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Reports</span>
                </a>
            </nav>
            
            <!-- Header Controls & Profile -->
            <div class="topbar-controls">
                <div class="topbar-search" style="position: relative;">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="global-search" placeholder="Quick search..." autocomplete="off">
                    <div id="global-search-results" style="display: none; position: absolute; top: calc(100% + 8px); left: 0; width: 340px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; max-height: 400px; padding: 12px; flex-direction: column; gap: 8px;"></div>
                </div>
                <div class="topbar-actions">
                    <button class="icon-btn" title="Notifications">
                        <i data-lucide="bell"></i>
                        <span class="badge"></span>
                    </button>
                    <button class="icon-btn" title="Toggle Theme" id="theme-toggle">
                        <i data-lucide="sun" id="theme-icon"></i>
                    </button>
                    <div class="divider"></div>
                    <div class="user-profile">
                        <div class="avatar" style="background: var(--primary-color); color: #000; font-weight: 700;">JS</div>
                        <div class="user-info">
                            <h4>John Storeowner</h4>
                            <select id="user-role-select" style="background: transparent; border: none; color: var(--text-secondary); font-size: 11px; font-family: var(--font-primary); font-weight: 600; cursor: pointer; outline: none; padding: 0;">
                                <option value="admin" style="background: var(--bg-card); color: var(--text-primary);">Admin</option>
                                <option value="manager" style="background: var(--bg-card); color: var(--text-primary);">Manager</option>
                                <option value="staff" style="background: var(--bg-card); color: var(--text-primary);">Staff</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main View Area (Full width) -->
        <div class="main-wrapper">
            <main class="content-view" id="main-content">
                <!-- Views render dynamically here -->
            </main>
        </div>
    </div>
    
    <!-- Modals Container (Global) -->
    <div id="modal-container" class="modal-overlay hidden"></div>
    
    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Excel Exporter Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
    
    <!-- App Entry & Modules -->
    <script type="module" src="app.js"></script>
</body>
</html>
